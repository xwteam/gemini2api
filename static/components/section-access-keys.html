<link rel="stylesheet" href="components/section-access-keys.css?v=1">

<section id="access-keys" class="section" aria-labelledby="access-keys-title">
    <div class="section-header">
        <h2 id="access-keys-title" data-i18n="accessKeys.title">访问密钥</h2>
        <div class="section-header-actions">
            <button class="btn btn-sm btn-primary" id="akk-add-btn">
                <i class="fas fa-plus"></i> <span data-i18n="accessKeys.add">签发密钥</span>
            </button>
        </div>
    </div>

    <p class="akk-intro" data-i18n="accessKeys.intro">签发可分发给不同人的访问密钥；每把可独立设置有效期、请求数上限、可用账号与可用模型，并可随时停用。.env 里的 API_KEY 始终全权有效。</p>

    <div id="akk-add-panel" class="akk-add-panel" style="display:none">
        <div class="akk-form-grid">
            <div class="form-group">
                <label for="akk-name" data-i18n="accessKeys.name">名称</label>
                <input type="text" id="akk-name" class="form-control" data-i18n-placeholder="accessKeys.namePlaceholder" placeholder="例如：张三">
            </div>
            <div class="form-group">
                <label for="akk-count" data-i18n="accessKeys.count">数量</label>
                <input type="number" id="akk-count" class="form-control" min="1" max="50" value="1">
            </div>
            <div class="form-group">
                <label for="akk-request-limit" data-i18n="accessKeys.requestLimit">请求数上限</label>
                <input type="number" id="akk-request-limit" class="form-control" min="0" data-i18n-placeholder="accessKeys.unlimited" placeholder="不限">
            </div>
            <div class="form-group">
                <label for="akk-duration-days" data-i18n="accessKeys.durationDays">有效天数（首次使用起算）</label>
                <input type="number" id="akk-duration-days" class="form-control" min="1" data-i18n-placeholder="accessKeys.unlimited" placeholder="不限">
            </div>
            <div class="form-group">
                <label for="akk-expires-at" data-i18n="accessKeys.expiresAt">绝对过期时间</label>
                <input type="datetime-local" id="akk-expires-at" class="form-control">
            </div>
        </div>
        <p class="akk-hint" data-i18n="accessKeys.validityHint">有效天数与绝对过期时间二选一，都留空则永不过期。</p>

        <div class="form-group">
            <label data-i18n="accessKeys.boundAccounts">绑定账号（不勾选 = 不限制）</label>
            <div id="akk-accounts-list" class="akk-checklist"></div>
        </div>
        <div class="form-group">
            <label data-i18n="accessKeys.allowedModels">允许模型（不勾选 = 不限制）</label>
            <div id="akk-models-list" class="akk-checklist"></div>
        </div>

        <div class="form-actions">
            <button class="btn btn-primary" id="akk-confirm" data-i18n="accessKeys.save">签发</button>
            <button class="btn btn-outline" id="akk-cancel" data-i18n="accessKeys.cancel">取消</button>
        </div>
    </div>

    <div id="akk-list-container" class="akk-list-container">
        <div class="chart-loading"><i class="fas fa-spinner fa-spin"></i> ...</div>
    </div>
</section>
